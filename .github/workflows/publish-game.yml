# Publishes web/index.html to GitHub Pages, plus version.json (the start of the file's SHA-256
# and the commit message). Apps and downloaded PC copies compare that with their own and offer the update.
name: Publish game update
on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - name: Stamp the build number
        run: |
          BUILD="$(git rev-list --count HEAD -- web)"
          sed -i "s|<meta name=\"ironfield-version\" content=\"\">|<meta name=\"ironfield-version\" content=\"$BUILD\">|" web/index.html
          grep -q "name=\"ironfield-version\" content=\"$BUILD\"" web/index.html || { echo "::error::Could not stamp the build number (ironfield-version meta missing from web/index.html)"; exit 1; }
      - name: Write version.json
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          VERSION="$(sha256sum web/index.html | cut -c1-12)"
          jq -n --arg v "$VERSION" --arg n "$(printf '%s' "$NOTES" | head -n1)" '{version: $v, notes: $n}' > web/version.json
          cat web/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
