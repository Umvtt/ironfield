# Makes a GitHub Release with both ways to play:
#   ironfield.apk  - Android app (game updates are offered inside the app)
#   ironfield.html - PC copy, opens in any browser and shows a banner when a newer game is out
# Runs whenever the game (web/) or the app (android/) changes, or by hand from the Actions tab.
# Tags are v<app>.<build>: <app> only goes up when android/ changes, so installed apps are only
# asked to reinstall for real app changes; game changes reach them through the in-app update.
name: Release
on:
  push:
    branches: [main]
    paths: ['web/**', 'android/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Work out versions and addresses
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          if [ "$(echo "$NAME" | tr '[:upper:]' '[:lower:]')" = "$OWNER_LC.github.io" ]; then URL="https://$OWNER_LC.github.io/"; else URL="https://$OWNER_LC.github.io/$NAME/"; fi
          {
            echo "GAME_URL=$URL"
            echo "GAME_VERSION=$(sha256sum web/index.html | cut -c1-12)"
            echo "APP_VERSION=$(git rev-list --count HEAD -- android)"
          } >> "$GITHUB_ENV"

      - name: Bundle an offline copy of the game into the app
        run: |
          mkdir -p android/app/src/main/assets
          cp web/index.html android/app/src/main/assets/index.html
          echo "$GAME_VERSION" > android/app/src/main/assets/game-version.txt

      - name: Make the PC copy
        run: |
          DL="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/ironfield.html"
          sed "s|<meta name=\"ironfield-build\" content=\"\">|<meta name=\"ironfield-build\" content=\"$GAME_VERSION\" data-site=\"$GAME_URL\" data-download=\"$DL\">|" web/index.html > ironfield.html
          grep -q "content=\"$GAME_VERSION\"" ironfield.html || { echo "::error::Could not stamp the PC copy (ironfield-build meta missing from web/index.html)"; exit 1; }

      - name: Load the signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/ironfield.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/ironfield.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret is missing. This build uses a throwaway key, so it cannot install over an earlier build."
          fi

      - name: Build the APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "Game URL: $GAME_URL  game $GAME_VERSION  app $APP_VERSION"
          gradle -p android assembleRelease --no-daemon \
            -PversionCode=$APP_VERSION -PgameUrl="$GAME_URL" -PrepoSlug="$GITHUB_REPOSITORY"
          cp android/app/build/outputs/apk/release/app-release.apk ironfield.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}.${{ github.run_number }}
          name: Ironfield v${{ env.APP_VERSION }}.${{ github.run_number }}
          body: |
            **Pick how you want to play:**

            | Download | For | How |
            |---|---|---|
            | **ironfield.apk** | Android phones and tablets | Open it on the phone, allow "install unknown apps" for your browser, install. Game updates are offered inside the app. |
            | **ironfield.html** | PC (Windows, Mac, Linux) | Save it and double-click it to play in your browser. When a new version is out, the game shows a banner with a download button. |
            | [Play in the browser](${{ env.GAME_URL }}) | Any device | Nothing to install. Always the newest version. |

            Game version `${{ env.GAME_VERSION }}`.
          files: |
            ironfield.apk
            ironfield.html
          make_latest: true
