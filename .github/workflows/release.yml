# Makes a GitHub Release with ironfield.html, a copy of the game you can save and open in any browser.
# It shows a banner when a newer game is out on the website. The website is the main way to play.
# Tags are game-<build>, so old Android app installs (which look for v<app>.<build> tags) never get an APK prompt.
name: Release
on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp the build number (same as the site, so both hash the same file)
        run: |
          BUILD="$(git rev-list --count HEAD -- web)"
          sed -i "s|<meta name=\"ironfield-version\" content=\"\">|<meta name=\"ironfield-version\" content=\"$BUILD\">|" web/index.html
          grep -q "name=\"ironfield-version\" content=\"$BUILD\"" web/index.html || { echo "::error::Could not stamp the build number (ironfield-version meta missing from web/index.html)"; exit 1; }
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Work out versions and addresses
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          if [ "$(echo "$NAME" | tr '[:upper:]' '[:lower:]')" = "$OWNER_LC.github.io" ]; then URL="https://$OWNER_LC.github.io/"; else URL="https://$OWNER_LC.github.io/$NAME/"; fi
          {
            echo "GAME_URL=$URL"
            echo "GAME_VERSION=$(sha256sum web/index.html | cut -c1-12)"
          } >> "$GITHUB_ENV"

      - name: Make the PC copy
        run: |
          DL="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/ironfield.html"
          sed "s|<meta name=\"ironfield-build\" content=\"\">|<meta name=\"ironfield-build\" content=\"$GAME_VERSION\" data-site=\"$GAME_URL\" data-download=\"$DL\">|" web/index.html > ironfield.html
          grep -q "content=\"$GAME_VERSION\"" ironfield.html || { echo "::error::Could not stamp the PC copy (ironfield-build meta missing from web/index.html)"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: game-${{ env.BUILD }}
          name: Ironfield build ${{ env.BUILD }}
          body: |
            **Play in the browser:** ${{ env.GAME_URL }} (always the newest version, works on phones and PC).

            **ironfield.html** is an offline copy for PC: save it and double-click it. When a new version is out it shows a banner with a download button.

            Game version `${{ env.GAME_VERSION }}`.
          files: |
            ironfield.html
          make_latest: true
